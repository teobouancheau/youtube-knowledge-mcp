name: Publish to npm

on:
  release:
    types: [published]

jobs:
  # The end-to-end lane runs on the same release event (see e2e.yml); a release
  # whose lane fails is not published.
  e2e:
    uses: ./.github/workflows/e2e.yml
    secrets: inherit

  publish:
    needs: e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # OIDC trusted publishing needs npm >= 11.5.1, newer than the npm bundled
      # with any Node release. Keep .nvmrc on a version npm@latest still
      # supports, or this step fails before anything is published.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run validate
      - run: npm publish --provenance --access public
